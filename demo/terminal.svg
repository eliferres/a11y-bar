<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 688" role="img" aria-labelledby="t d" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16">
  <title id="t">a11y-bar demo</title>
  <desc id="d">a11y-bar checks a page planting one violation per rule and reports six findings with exit 1, passes the clean page with exit 0, lists the WCAG criterion of each finding from the JSON output, and refuses a stylesheet with no markup with exit 2.</desc>
  <style>
    .p { fill: #7ee2a8; }
    .cmd { fill: #e8eef5; }
    .dim { fill: #9fb0c0; }
    .bad { fill: #ff9494; }
    .good { fill: #7ee2a8; }
  </style>
  <rect width="660" height="688" rx="14" fill="#0b0f14"/>
  <rect width="660" height="40" rx="14" fill="#11161d"/>
  <rect y="26" width="660" height="14" fill="#11161d"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="92" y="26" class="dim" font-size="14">a11y-bar</text>
  <text x="24" y="72"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 -m a11y_bar demo/broken; echo &quot;exit $?&quot;</tspan></text>
  <text x="24" y="100" class="dim">demo/broken/index.html:11: [contrast] p.note (inherited): 2…</text>
  <text x="24" y="128" class="dim">demo/broken/index.html:13: [alt] &lt;img&gt; has no alt text</text>
  <text x="24" y="156" class="dim">demo/broken/index.html:16: [focus-visible] 1 interactive el…</text>
  <text x="24" y="184" class="dim">demo/broken/index.html:16: [touch-target] button is 20px ta…</text>
  <text x="24" y="212" class="dim">demo/broken/index.html:16: [focus-order] &lt;button tabindex=&quot;…</text>
  <text x="24" y="240" class="dim">demo/broken/style.css:10: [reduced-motion] CSS animates and…</text>
  <text x="24" y="268" class="bad">FAIL: 6 finding(s), 2 file(s) read, 6 rules</text>
  <text x="24" y="296" class="bad">exit 1</text>
  <text x="24" y="324"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 -m a11y_bar demo/clean; echo &quot;exit $?&quot;</tspan></text>
  <text x="24" y="352" class="good">PASS: 0 finding(s), 2 file(s) read, 6 rules</text>
  <text x="24" y="380" class="dim">exit 0</text>
  <text x="24" y="408"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 -m a11y_bar --json demo/broken | grep '&quot;wcag&quot;'</tspan></text>
  <text x="24" y="436" class="dim">      &quot;wcag&quot;: &quot;1.4.3&quot;,</text>
  <text x="24" y="464" class="dim">      &quot;wcag&quot;: &quot;1.1.1&quot;,</text>
  <text x="24" y="492" class="dim">      &quot;wcag&quot;: &quot;2.4.7&quot;,</text>
  <text x="24" y="520" class="dim">      &quot;wcag&quot;: &quot;2.5.8&quot;,</text>
  <text x="24" y="548" class="dim">      &quot;wcag&quot;: &quot;2.4.3&quot;,</text>
  <text x="24" y="576" class="dim">      &quot;wcag&quot;: &quot;2.3.3&quot;,</text>
  <text x="24" y="604"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 -m a11y_bar demo/broken/style.css; echo &quot;exit $?&quot;</tspan></text>
  <text x="24" y="632" class="dim">a11y-bar: no .html, .htm, .jsx or .tsx files found in demo/…</text>
  <text x="24" y="660" class="dim">exit 2</text>
</svg>