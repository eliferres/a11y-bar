[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a11y-bar"
dynamic = ["version"]
description = "A browser-free check of a web project's files for the WCAG rules files alone can decide"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Eli Ferres" }]

[project.urls]
Source = "https://github.com/eliferres/a11y-bar"
Changelog = "https://github.com/eliferres/a11y-bar/blob/main/CHANGELOG.md"

[project.scripts]
a11y-bar = "a11y_bar:main"

[tool.setuptools]
packages = ["a11y_bar"]

[tool.setuptools.dynamic]
version = { attr = "a11y_bar.__version__" }
