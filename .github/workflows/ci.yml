name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check the demo pages
        run: |
          python -m a11y_bar demo/clean
          python -m a11y_bar demo/broken && code=0 || code=$?
          [ "$code" = 1 ] || { echo "demo/broken exited $code, expected 1"; exit 1; }
      - name: Install and run the console script
        run: |
          python -m pip install .
          a11y-bar --version
          a11y-bar demo/clean
